# The inline theme bootstrap in web/index.html must stay synchronous to avoid a flash of the
# wrong theme, so script-src pins its exact bytes by hash instead of allowing 'self'. This hash
# is asserted against the live script in web/src/test/csp-hash.test.ts; a reformat of the inline
# script invalidates it and that test is what catches it. Both the favicon and the Select caret
# are data: URIs, so img-src allows the data: scheme. No inline `style` attribute exists in the
# SPA source, so style-src stays 'self' only.
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' 'sha256-P0HvFeS0dtSF2wj/V8ePDVpdiTlyAQawuuESP/UMqdY='; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text-based assets compress well; the SVG favicon/caret are data URIs already inlined into
    # HTML/CSS responses, so image/svg+xml here only matters for a standalone .svg request.
    # Both JavaScript media types are listed because nginx's bundled mime.types maps .js to
    # application/javascript before 1.21.1 and to text/javascript from 1.21.1 on; matching only one
    # would silently stop compressing the largest asset on an image bump. text/html is absent
    # deliberately — nginx always compresses it and warns on the duplicate.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Baseline security headers for the served SPA. add_header does not inherit into a location
    # block that declares its own add_header, so every location below that sets a header
    # re-declares this full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Content-Security-Policy $csp_policy always;

    # Proxy the API to the backend compose service.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (answers/workflow-runs/documents events streams): buffering left on would make
        # nginx hold each event until its buffer fills, which presents as "SSE silently does not
        # work in production". 300s covers a connection sitting idle between the 15s heartbeats
        # with wide margin.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Vite content-hashes these filenames, so a long-lived immutable cache is safe: a changed
    # file ships under a new name rather than overwriting this one.
    # `expires` is deliberately not used here: it emits its own Cache-Control alongside an Expires
    # header, so pairing it with the explicit directive below puts two different Cache-Control
    # values on one response.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    # index.html references the hashed filenames above by name. Caching it would leave a client
    # requesting filenames a new deploy already removed; try_files then falls back to this same
    # stale index.html, and the browser receives HTML where a module script was expected.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
