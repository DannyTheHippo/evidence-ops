# Non-secret configuration for the application processes, declared once and merged into each.
#
# The split is deliberate: `.env` carries credentials, the spend ceilings that bound them, and the
# provider switch that decides which credential is in use. Every other knob is declared here, so the
# configuration a deployment actually runs under can be read in one file instead of reconstructed
# from a schema default, an example file, and an env file nobody can safely print. Anything omitted
# here keeps `environment.config.ts`'s zod default — that schema, not this file, is the source of
# truth for defaults, and restating a value here claims this deployment wants something different.
#
# `${VAR:-default}` throughout, so an operator overrides from the shell without editing this file.
#
# Two precedence rules decide where a variable can live, and they point in opposite directions:
#   - An inline `environment:` value always beats `env_file`. So the spend ceilings are deliberately
#     absent from this block — declaring one here would silently override the ceiling an operator
#     set in `.env`, which is the one override that must never happen quietly.
#   - Compose reads `.env` for `${VAR}` interpolation. So a variable named here with a default still
#     honors `.env`, which is how `MODEL_PROVIDER` reaches the container from the file that also
#     holds the key it selects.
x-app-environment: &app-environment
  # The containerised stack is the deployment path; the host dev loop (`start:dev`/`worker:dev`)
  # is where a non-production environment belongs. Under production, `environment.config.ts`'s
  # `superRefine` refuses to boot without `JWT_SECRET` — a half-configured process that starts and
  # then fails one request at a time is harder to diagnose than one that names what is missing.
  NODE_ENV: ${NODE_ENV:-production}
  # In-network addresses only — never in `.env`, which stays host-loop-relative (localhost:*) so
  # the same secrets file works for `start:dev`/`worker:dev`/`temporal:dev` too. Hyphen,
  # `evidence-ops`: the underscore spelling produces a stray orphan database.
  MONGO_DB_URI: mongodb://mongo:27017/evidence-ops?directConnection=true
  # Pinned off, never overridable: `true` starts an in-process `mongodb-memory-server` and the
  # container would quietly serve a throwaway database instead of the one beside it.
  MONGO_MEMORY_SERVER: "false"
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-evidence-ops}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Both default to localhost, which is wrong for anything served from a real origin: `CORS_ORIGIN`
  # is functional — it is the single origin `enableCors` permits, so a mismatch means the browser
  # rejects every cross-origin call with nothing wrong in the logs.
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
  URL: ${URL:-http://localhost:8090}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
  # Every model named here must have an entry in its provider's pricing table: cost is asserted
  # before each request, so an unpriced model fails the first call rather than degrading.
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  ANTHROPIC_TIMEOUT_MS: ${ANTHROPIC_TIMEOUT_MS:-60000}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
  # Any OpenAI-compatible endpoint — Azure, vLLM, Ollama — points here. Keyless is legal: the
  # provider omits the auth header entirely rather than sending an empty bearer.
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
  RETRIEVAL_FUSION: ${RETRIEVAL_FUSION:-server}
  RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-12}
  # Off by default: on, spans carry prompt and completion text, which puts evidence content in the
  # tracing backend and widens the trust boundary to whoever can read traces.
  OTEL_CAPTURE_MODEL_CONTENT: ${OTEL_CAPTURE_MODEL_CONTENT:-false}
  # The api scrapes on this port and the worker on the next one, derived in `instrumentation.ts`
  # from this single value rather than a second variable that could drift from it.
  METRICS_PORT: ${METRICS_PORT:-9464}

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.3.4
    container_name: evidence-ops-mongo
    # Load-bearing, not cosmetic: the image starts mongod with `--replSet <container hostname>`,
    # and the replica-set config persisted in `evidence_ops_data` records that name in its `_id`.
    # Docker assigns a fresh random hostname on every container recreate, so without pinning this
    # the next `docker compose up` starts mongod under a set name the stored config does not match
    # ("Our replica set config is invalid or we are not a member of it") — the node never becomes
    # primary and mongot never starts, which surfaces as `Error connecting to Search Index
    # Management service`. A set `_id` cannot be changed by reconfig, so recovery means wiping the
    # volume. Pinning the hostname keeps the name stable across recreates.
    hostname: evidence-ops-mongo
    restart: always
    # mem_limit: 1536m. Observed 550.8 MiB resident (2026-08-11, all 9 services healthy) against the
    # 4-document eval fixture set — deliberately NOT tuned down to that number. This is mongod plus a
    # Lucene-backed $search/$vectorSearch index, and both grow with the corpus; 550 MiB is the floor
    # for a toy corpus, not the ceiling for a real one.
    mem_limit: 1536m
    ports:
      # 27018, not 27017, and it matters that this matches `environment.config.ts`'s dev-default
      # `MONGO_DB_URI` exactly: host-run processes (`start:dev`, `worker:dev`, `migrate:up`, the
      # eval) fall back to that default, so a mismatch here means they connect nowhere while the
      # container looks perfectly healthy. 27017 is the default for every other Mongo project on a
      # machine, which is why neither side uses it. Overridable, but override both together.
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - evidence_ops_data:/data/db
      - evidence_ops_config:/data/configdb
      # `/data/mongot` holds mongot's Lucene index files, and — unlike the two above — the image
      # does NOT declare it as a VOLUME. Without this mount it lives in the container's writable
      # layer and is destroyed on every recreate, while the migration changelog that records
      # "search indexes created" persists in /data/db. The result is a stack that comes up
      # healthy, a `migrate:up` that correctly reports nothing to do, and retrieval that silently
      # returns zero rows — measured: 12 chunks present, 0 search indexes, every eval question
      # answering `insufficient_evidence`. Index state is infrastructure, but the changelog models
      # it as schema, and only one of the two survived.
      - evidence_ops_mongot:/data/mongot
    networks:
      - evidence_ops_net
    healthcheck:
      # Fails CLOSED on a node that is up but unusable. `ping` alone answers on a node whose
      # replica set is invalid — it reported healthy while writes were failing `not primary` and
      # search was unreachable, so every dependent service started against a broken database.
      # `isWritablePrimary` is the property callers actually need: migrations, GridFS writes and
      # `$rankFusion` all require a primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.hello().isWritablePrimary || (function(){ throw new Error('not a writable primary') })()",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: evidence-ops-jaeger
    restart: always
    # mem_limit: 128m. The original figure behind this was 37.5 MiB "idle" (2026-08-11) — measured
    # moments after start, which turned out to be the wrong thing to measure. all-in-one defaults to
    # in-memory span storage with NO retention bound, so it grows monotonically with every trace it
    # receives: after ~13 hours of a running stack it was observed at 123.3 MiB, i.e. 96% of this
    # limit and still climbing (2026-08-12). Raising the limit would only move the OOM later, so the
    # bound goes on the thing that actually grows — see MEMORY_MAX_TRACES below. An idle reading of a
    # monotonically growing process is not a capacity measurement.
    mem_limit: 128m
    environment:
      # Caps retained traces so memory plateaus instead of growing until the kernel intervenes.
      # 5000 is far more than any demo or eval run produces, and eviction is oldest-first — this is a
      # local trace viewer, not a retention system, so losing the oldest traces costs nothing.
      MEMORY_MAX_TRACES: "5000"
    ports:
      # UI
      - "16686:16686"
      # OTLP HTTP receiver. Exposed to the host because `OTEL_EXPORTER_OTLP_ENDPOINT`'s
      # `.env.example` default (http://localhost:4318) targets this port for anything running
      # outside the network — start:dev, worker:dev, temporal:dev. In-network callers (the `api`/
      # `worker`/`web` containers under the `full` profile) use http://jaeger:4318 instead.
      - "4318:4318"
    networks:
      - evidence_ops_net
    # Gated separately from `temporal`/`temporal-postgres`/`temporal-ui`: retrieval/eval work needs
    # neither, so `--profile observability` lets someone bring up tracing alone. Also in `full` so a
    # fresh-clone demo gets everything with one flag.
    profiles:
      - observability
      - full

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: evidence-ops-prometheus
    restart: always
    # mem_limit: 256m. Not measured here — this repo's sandbox has no Docker/socket access to bring
    # the stack up — but Prometheus's own baseline (Go runtime + WAL) already sits above the tight
    # limits this file gives purely static services (`temporal-ui`'s 64m), and headroom is kept for
    # the five `alert-rules.yml` expressions plus whatever series count a growing corpus and longer
    # uptime add.
    mem_limit: 256m
    volumes:
      # Read-only: this is committed configuration, not writable state. No named volume for
      # `/prometheus` (the TSDB data dir) — ephemeral by design, the same call `qdrant` below makes
      # for the same reason: this is alerting infrastructure for a pilot, not a metrics archive, and
      # losing history on a recreate costs nothing an operator needs back.
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      # UI and API, so the person bringing the stack up can check target health at
      # http://localhost:9090/targets without shelling into the container. Fixed rather than
      # overridable like `mongo`/`api`/`web`/`qdrant`'s *_HOST_PORT — 9090 is Prometheus's own
      # default and collision risk is the same low bar `jaeger`'s fixed ports above accept.
      - "9090:9090"
    networks:
      - evidence_ops_net
    healthcheck:
      # Prometheus's own busybox base ships wget, not curl — but busybox wget's flag set is a strict
      # subset of GNU wget's (no `--no-verbose`/`--tries`), so `-q --spider` is the only form that
      # works regardless of which one the image actually has. Unverified beyond `docker compose
      # config`, the same caveat `temporal`'s healthcheck above carries — this sandbox cannot pull or
      # run the image.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Gated the same way `jaeger` above is: retrieval/eval work needs neither tracing nor metrics, so
    # `--profile observability` brings up both without the rest of `full`. Must NOT be profile-less —
    # `docker compose up -d mongo` for a test run must not also start a monitoring stack.
    profiles:
      - observability
      - full

  temporal-postgres:
    image: postgres:16-alpine
    container_name: evidence-ops-temporal-postgres
    restart: always
    # mem_limit: 384m (up from 256m). Observed 149.8 MiB (2026-08-11) — was 58% of the old limit, the
    # tightest ratio measured of any service. Raised rather than left tight so Postgres has room to
    # grow past a single measurement instead of sitting one connection spike from an OOM-kill.
    mem_limit: 384m
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - evidence_ops_temporal_postgres:/var/lib/postgresql/data
    networks:
      - evidence_ops_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # `temporal` (below) depends_on this service — Compose requires a shared profile across a
    # depends_on edge, so this carries every profile `temporal` does.
    profiles:
      - temporal
      - full

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: evidence-ops-temporal
    restart: always
    # mem_limit: 512m. Observed 256.1 MiB (2026-08-11) — left unchanged, ~2x headroom. This process
    # runs the frontend/history/matching/worker services plus the `auto-setup` schema migration; the
    # workflow-code bundling spike that forces `worker`'s wider margin happens client-side, in
    # `worker`, not here.
    mem_limit: 512m
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      # No DYNAMIC_CONFIG_FILE_PATH override: the official temporalio/docker-compose reference sets
      # this to a path it bind-mounts from the host repo (`./dynamicconfig`). This file has no such
      # mount, and the path's presence baked into the `auto-setup` image is unverified — omitting
      # it lets the image fall back to its own built-in default rather than pointing at a file that
      # may not exist, which would leave the container running with no dynamic config at all.
    ports:
      # gRPC, published so a host-run `worker:dev`/`start:dev` (the primary dev loop, see README)
      # can point TEMPORAL_ADDRESS at this container instead of `temporal server start-dev`.
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks:
      - evidence_ops_net
    healthcheck:
      # `auto-setup`'s own entrypoint drives schema setup with `tctl`, so the CLI ships in the
      # image; unverified here beyond `docker compose config` — this repo's sandbox cannot pull or
      # run the image, so the exact command has not been exercised against a live container.
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    # `temporal-ui` (below) depends_on this service — carries every profile `temporal-ui` does, for
    # the same shared-profile reason noted on `temporal-postgres` above.
    profiles:
      - temporal
      - full

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: evidence-ops-temporal-ui
    restart: always
    # mem_limit: 64m (down from 256m). Observed 25.3 MiB (2026-08-11) — this is a static file server
    # with no in-memory buffering to size for, so it gets the same tight treatment as `web` below
    # rather than the headroom `jaeger` needs for span buffering.
    mem_limit: 64m
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      # Host port matches the Web UI port `temporal server start-dev` binds in the host dev loop
      # (README "What runs where" / step 5), so http://localhost:8233 is correct either way.
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - evidence_ops_net
    profiles:
      - temporal
      - full

  migrate:
    build:
      context: .
      target: tasks
    command: npm run migrate:up
    environment:
      # Hyphen, `evidence-ops` — the underscore spelling (`evidence_ops`) previously produced a
      # stray orphan database and must not reappear.
      MONGO_DB_URI: mongodb://mongo:27017/evidence-ops?directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - evidence_ops_net
    restart: "no"
    # `api`/`worker` (below) depends_on this completing successfully — Compose requires a shared
    # profile across a depends_on edge, so this must carry `full` too rather than staying
    # profile-less; profile-less would start it under the bare `mongo`-only default, which the
    # acceptance gate forbids.
    profiles:
      - full

  api:
    build:
      context: .
      target: runtime
    env_file:
      # Secrets only — `ANTHROPIC_API_KEY`, `VOYAGE_API_KEY`, `OPENAI_API_KEY`, `JWT_SECRET`.
      # `required: false` so a missing file does not hard-fail `up`; under the production
      # `NODE_ENV` above, an absent `JWT_SECRET` is caught by config validation at boot instead,
      # which names the variable. An absent model or embedding key is not caught there — it parses
      # as optional and fails at the first provider call.
      - path: .env
        required: false
    environment:
      <<: *app-environment
      # The worker gets this from its own `worker:dev` script; the api's ENTRYPOINT runs node
      # directly and bypasses npm, so without it here both processes report the same default
      # service name and a cross-process trace becomes unreadable.
      OTEL_SERVICE_NAME: evidence-ops-api
      # Set only here, not on the shared `x-app-environment` anchor: `worker` never boots an HTTP
      # server (`app.config.ts` never runs there) and `mcp` boots its own bare `express()` app with
      # no `trust proxy` set at all, so neither reads this. `web` (nginx) is the one hop in front of
      # this process now that its host-port publish above is loopback-only.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # SSE streams are served only by this process. Caps bound how many concurrent streams one
      # tenant or user may hold open, across all three SSE routes. The lifetime only bounds the
      # document-list stream (`DocumentsService.streamList`) — the only one of the three with no
      # terminal state of its own to close the connection on — forcing a periodic re-subscribe (and
      # re-auth) rather than an indefinite connection; the answer and workflow-run streams close on
      # their own terminal state well before this would ever fire.
      SSE_MAX_CONNECTIONS_PER_TENANT: ${SSE_MAX_CONNECTIONS_PER_TENANT:-100}
      SSE_MAX_CONNECTIONS_PER_USER: ${SSE_MAX_CONNECTIONS_PER_USER:-10}
      SSE_MAX_STREAM_LIFETIME_MS: ${SSE_MAX_STREAM_LIFETIME_MS:-1800000}
      # API keys are minted only through this process's `api-keys` controller; the mcp process only
      # verifies them.
      API_KEY_DEFAULT_TTL_DAYS: ${API_KEY_DEFAULT_TTL_DAYS:-90}
    # mem_limit: 256m (down from 512m). Observed 100.0 MiB (2026-08-11) — a stateless NestJS process
    # with no in-process bundling step like `worker`'s Temporal `Worker.create`; 2.5x headroom is
    # enough.
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
      # `0003-search-indexes.ts` blocks until `$search`/`$vectorSearch` report READY (tens of
      # seconds on a fresh volume) — without this, api/worker would go healthy and accept traffic
      # against a store with no indexes yet, the exact "silently matches nothing" failure the
      # migration was written to prevent.
      migrate:
        condition: service_completed_successfully
    ports:
      # Host side defaults to 3001, not 3000, for the same collision concern `mongo`'s
      # `MONGO_HOST_PORT` override above exists for: 3000 is the default for practically every Node
      # API on a developer machine, and the host dev
      # loop (`npm run start:dev`, the primary path per the README) already binds it. Publishing
      # 3000 here made `--profile full up` fail outright with "port is already allocated" against an
      # unrelated project's container. Container side stays 3000 so nothing inside the network,
      # including the healthcheck and nginx's `proxy_pass`, has to care.
      #
      # Bound to loopback: `web` (nginx) runs in this same `full` profile and already reaches this
      # service in-network at `api:3000`, so the only reason to publish this port at all is direct
      # host access for local debugging. A bare `${API_HOST_PORT}:3000` publish is reachable from
      # any remote address, which bypasses nginx entirely — `TRUST_PROXY_HOPS` above assumes nginx
      # is the only hop in front of this process, and a request that skips nginx can forge
      # `X-Forwarded-For` to control `req.ip`. Loopback-only keeps that assumption true for every
      # caller except one already on this host.
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    networks:
      - evidence_ops_net
    healthcheck:
      # No curl/wget on node:26-slim; Node itself makes the request instead of adding a package.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles:
      - full

  worker:
    build:
      context: .
      # `runtime`, running COMPILED output — not the `build` stage under `ts-node`.
      #
      # The rule this repo learned the hard way (commit d9a17ce, a full day lost) is narrower than
      # "always ts-node": `tsx`/esbuild drops `emitDecoratorMetadata`, so Nest constructor
      # injection arrives `undefined` and presents as a config error rather than a DI one. `tsc`
      # emits that metadata correctly, so `dist/worker/main.js` — produced by `nest build` — is
      # immune by construction. `ts-node` is the right answer for the HOST dev loop, where there is
      # no build step; it is the wrong answer in an image that already contains `dist/`.
      #
      # Running source here also OOM-killed the container at 512m: `ts-node` compiles the graph
      # in-process and Temporal's `Worker.create` bundles workflow code on top of it, and V8 sizes
      # its heap from the container limit. The compiled entrypoint pays neither cost.
      target: runtime
    # `entrypoint`, not `command`. The image's ENTRYPOINT is exec-form and runs `dist/main.js`, so a
    # `command` here is APPENDED to it as argv rather than replacing it: the container would run the
    # API with the worker's argv trailing behind it, ignored. Nothing would poll the task queue, and
    # every workflow the API started would sit queued forever behind a container that looks healthy.
    entrypoint:
      ["node", "--import", "./dist/instrumentation.js", "dist/worker/main.js"]
    env_file:
      # Secrets only; see the api service above.
      - path: .env
        required: false
    environment:
      <<: *app-environment
      # Set here rather than inherited from `worker:dev`'s inline assignment, which this command
      # bypasses. Without it the worker and api report the same service name and the cross-process
      # trace — the whole point of the Temporal OTel interceptors — becomes unreadable.
      OTEL_SERVICE_NAME: evidence-ops-worker
      # Worker-only: every model and embedding call runs in this process, so the knobs that shape
      # ingestion and answering are tuned here rather than on the api.
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}
      VOYAGE_DIMENSIONS: ${VOYAGE_DIMENSIONS:-1024}
      # Voyage's free tier rate-limits hard; the provider paces itself to this number rather than
      # discovering the limit through 429s.
      VOYAGE_REQUESTS_PER_MINUTE: ${VOYAGE_REQUESTS_PER_MINUTE:-3}
      VOYAGE_MAX_RETRIES: ${VOYAGE_MAX_RETRIES:-5}
      VOYAGE_MAX_RETRY_WAIT_MS: ${VOYAGE_MAX_RETRY_WAIT_MS:-300000}
      VOYAGE_REQUEST_TIMEOUT_MS: ${VOYAGE_REQUEST_TIMEOUT_MS:-30000}
      EXTRACTION_CHUNK_CONCURRENCY: ${EXTRACTION_CHUNK_CONCURRENCY:-2}
      # Container-relative, and nothing mounts a host directory onto it: the local-folder connector
      # reads this path inside the container, so a pilot ingesting from the host needs a bind mount
      # added here as well as a matching path.
      SOURCES_INBOX_DIR: ${SOURCES_INBOX_DIR:-./inbox}
      SOURCE_SYNC_INTERVAL_MS: ${SOURCE_SYNC_INTERVAL_MS:-300000}
    # MCP_PORT / MCP_RATE_LIMIT_PER_MINUTE are set on the `mcp` service below, not here — the two
    # application processes never read them.
    # mem_limit: 768m. Observed 304.4 MiB (2026-08-11) running compiled output — Temporal still
    # bundles workflow code with webpack inside `Worker.create` at startup, which spikes well above
    # that steady-state number on every restart (see the OOM-at-512m comment above, from when the
    # graph was compiled in-process too). Kept generous — a repeatable startup spike, not a one-off
    # peak — rather than trimmed to steady-state.
    mem_limit: 768m
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - evidence_ops_net
    profiles:
      - full

  # The MCP surface: a third application process exposing verified evidence Q&A to any MCP client.
  # Separate from `api` because it speaks JSON-RPC over its own listener and authenticates with
  # personal access tokens rather than the session cookie — a different protocol and a different
  # credential, so a different process rather than another route on the API.
  mcp:
    build:
      context: .
      target: runtime
    # `entrypoint`, not `command`, for the same reason as `worker`: the image's ENTRYPOINT is
    # exec-form, so a `command` is appended to it as argv instead of replacing it, and the
    # container would run the API with this path trailing behind it, ignored.
    entrypoint:
      ["node", "--import", "./dist/instrumentation.js", "dist/mcp/main.js"]
    env_file:
      # Secrets only; see the api service above.
      - path: .env
        required: false
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: evidence-ops-mcp
      # Container side fixed, host side overridable — the same split as `api`'s PORT, so an
      # override cannot desynchronise the published mapping from what the process binds.
      MCP_PORT: "3002"
      # Charged per JSON-RPC request found in the body, not per HTTP POST: the SDK dispatches
      # batch arrays, so a per-POST limit would let a single request drive hundreds of tool calls
      # against one decrement.
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      # Applied before `authenticate`, keyed on the caller's IP rather than the verified actor
      # MCP_RATE_LIMIT_PER_MINUTE above is keyed on — an unauthenticated caller has no actor yet.
      MCP_PRE_AUTH_IP_RATE_LIMIT_WINDOW_MS: ${MCP_PRE_AUTH_IP_RATE_LIMIT_WINDOW_MS:-60000}
      MCP_PRE_AUTH_IP_RATE_LIMIT_MAX_REQUESTS: ${MCP_PRE_AUTH_IP_RATE_LIMIT_MAX_REQUESTS:-20}
    # mem_limit matched to `api` rather than `worker`: this process serves requests and starts
    # workflows, it does not run the Temporal worker's startup bundling step.
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy
      # `request_resolution` starts a workflow, so this surface needs Temporal even though it runs
      # no worker itself. The read tools do not.
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Published: an MCP client is by definition outside this network. Nothing here bounds who can
      # reach it — the surface authenticates every call with a PAT, and restricting network reach
      # is the operator's concern.
      - "${MCP_HOST_PORT:-3002}:3002"
    networks:
      - evidence_ops_net
    profiles:
      - full

  web:
    build:
      context: ./web
    # mem_limit: 64m. Observed 9.4 MiB (2026-08-11) — a static nginx server; left unchanged, it was
    # already sized correctly and gets the same tight treatment as `temporal-ui` above.
    mem_limit: 64m
    ports:
      # Overridable for the same reason as `api` and `mongo` above. 80 is free on this machine
      # today, but it is the single most contended host port there is, and a demo that dies on
      # "port is already allocated" is a bad demo.
      - "${WEB_HOST_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - evidence_ops_net
    profiles:
      - full

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: evidence-ops-qdrant
    restart: always
    # Measured 2026-08-12: 63 MiB resident idle with the benchmark collection absent (the eval run
    # creates and drops it per invocation), i.e. ~25% of this limit. Kept at 256m rather than
    # tightened to the observation: the measurement is of an EMPTY instance, and the headroom covers
    # the 12-vector collection the benchmark builds plus Qdrant's own segment overhead.
    mem_limit: 256m
    ports:
      # Overridable for the same host-port-collision reason as `mongo`/`api`/`web` above.
      - "${QDRANT_HOST_PORT:-6333}:6333"
    # No volume: ephemeral by design. This is benchmark infrastructure, not the retrieval store —
    # the eval harness recreates and repopulates the collection from the already-embedded
    # `evidence_chunks` rows on every run, so nothing here needs to survive a recreate.
    networks:
      - evidence_ops_net
    healthcheck:
      # No curl/wget in this image, but `tools/entrypoint.sh` — the image's own CMD — has the
      # shebang `#!/usr/bin/env bash` (verified against
      # github.com/qdrant/qdrant/blob/v1.19.0/tools/entrypoint.sh), so the container could not
      # start at all without bash present. A bash `/dev/tcp` probe is therefore safe here.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # `full` is the product demo stack and the benchmark's conclusion is that MongoDB stays the
    # production retrieval store, so this deliberately does NOT carry `full`. Nothing
    # `depends_on` qdrant, so the shared-profile rule noted on `temporal-postgres`/`temporal`/
    # `temporal-ui` above does not bind here — this can sit alone in its own profile.
    profiles:
      - qdrant

networks:
  evidence_ops_net:

volumes:
  evidence_ops_data:
  evidence_ops_config:
  evidence_ops_mongot:
  evidence_ops_temporal_postgres:
